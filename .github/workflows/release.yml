name: Release

"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from commit message
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          version=$(printf '%s' "$COMMIT_MESSAGE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-check:
    uses: ./.github/workflows/build-check.yml
    needs: release-version
    if: needs.release-version.outputs.version != ''

  release-windows:
    needs: [release-version, build-check]
    if: needs.release-version.outputs.version != ''
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install dependencies
        run: npm ci

      - name: Install Rust Windows targets
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add i686-pc-windows-msvc

      - name: Build Windows installer (x64 + x86)
        run: npm run dist:win:all

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_VERSION
          $x64Source = Get-Item "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe" | Select-Object -First 1
          $x86Source = Get-Item "src-tauri\target\i686-pc-windows-msvc\release\bundle\nsis\*.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $x64 = Copy-Item $x64Source.FullName "release\VideoEditing-$tag-x64.exe" -PassThru
          $x86 = Copy-Item $x86Source.FullName "release\VideoEditing-$tag-x86.exe" -PassThru

          gh release create $tag `
            --title "VideoEditing $tag" `
            --generate-notes `
            $x64.FullName `
            $x86.FullName
