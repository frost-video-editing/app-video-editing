name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  build-check:
    uses: ./.github/workflows/build-check.yml

  release-windows:
    needs: build-check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (x64 + x86)
        run: npm run dist:win:all

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $x64  = Get-Item "release\VideoEditing-*-x64.exe"  | Select-Object -First 1
          $x86 = Get-Item "release\VideoEditing-*-x86.exe"  | Select-Object -First 1

          gh release create $tag `
            --title "VideoEditing $tag" `
            --generate-notes `
            $x64.FullName `
            $x86.FullName
