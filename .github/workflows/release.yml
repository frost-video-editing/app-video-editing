name: Release

"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from commit message
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          version=$(printf '%s' "$COMMIT_MESSAGE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-check:
    uses: ./.github/workflows/build-check.yml
    needs: release-version
    if: needs.release-version.outputs.version != ''

  release-windows:
    needs: [release-version, build-check]
    if: needs.release-version.outputs.version != ''
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (x64 + x86)
        run: npm run dist:win:all

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_VERSION
          $x64  = Get-Item "release\VideoEditing-*-x64.exe"  | Select-Object -First 1
          $x86 = Get-Item "release\VideoEditing-*-x86.exe"  | Select-Object -First 1

          gh release create $tag `
            --title "VideoEditing $tag" `
            --generate-notes `
            $x64.FullName `
            $x86.FullName
